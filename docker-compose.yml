services:
  # Base MongoDB pour note-service
  mongo:
    image: mongo:6.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: notesdb
    ports:
      - "27018:27017"
    volumes:
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    networks:
      - medilabo-network

    healthcheck:

      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  patient-service:
    build: ./patient-service
    container_name: patient-service

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/patientsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: medilabo
      SPRING_DATASOURCE_PASSWORD: medipass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"

        # Flyway (force le baseline UNE FOIS sur la base déjà existante)j'ai rajouté
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"

      SERVER_PORT: 9001
    ports:
      - "9001:9001"
    networks:
      - medilabo-network


  note-service:
    build: ./note-service
    container_name: note-service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://note_user:note_pass@mongo:27017/notesdb?authSource=notesdb
    ports:
      - "9002:9002"
    networks:
      - medilabo-network



  diabetes-risk-service:
    build: ./diabetes-risk-service
    container_name: diabetes-risk-service
    depends_on:
      - patient-service
      - note-service
    environment:
      SERVER_PORT: 9003
      PATIENT_SERVICE_URL: http://patient-service:9001
      NOTE_SERVICE_URL: http://note-service:9002
    ports:
      - "9003:9003"
    networks:
      - medilabo-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    depends_on:
      - patient-service
      - diabetes-risk-service
      - note-service
    environment:
      SERVER_PORT: 8080
      PATIENT_SERVICE_URL: http://patient-service:9001
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: patient-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://patient-service:9001
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/patients,/api/patients/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: front-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://front-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/login,/css/**,/js/**,/images/**,/assets/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: note-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://note-service:9002
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/notes,/api/notes/**
    ports:
      - "8080:8080"
    networks:
      - medilabo-network

  front-service:
    build: ./front-service
    container_name: front-service
    depends_on:
      - patient-service
      - note-service
      - diabetes-risk-service
    environment:
      SERVER_PORT: 8081
      PATIENT_SERVICE_URL: http://patient-service:9001
      NOTE_SERVICE_URL: http://note-service:9002
      RISK_SERVICE_URL: http://diabetes-risk-service:9003
    ports:
      - "8081:8081"
    networks:
      - medilabo-network


networks:
  medilabo-network:
   driver: bridge

volumes:
  mongo_data:
  mysql_data:

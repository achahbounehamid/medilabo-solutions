spring.application.name=gateway-service
#server.port=8080
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

# ------------Route vers patient-service----------------
spring.cloud.gateway.routes[0].id=patient-service
#spring.cloud.gateway.routes[0].uri=http://patient-service:9001
spring.cloud.gateway.routes[0].uri=${PATIENT_SERVICE_URL:http://patient-service:9001}
spring.cloud.gateway.routes[0].predicates[0]=Path=/patient/**

# --------------Route vers front-service---------------
spring.cloud.gateway.routes[1].id=front-service
spring.cloud.gateway.routes[1].uri=http://front-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/login, /css/**, /js/**, /images/**, /assets/**

#---------------Logs utiles pour debug du gateway------------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.root=info
spring.main.web-application-type=reactive


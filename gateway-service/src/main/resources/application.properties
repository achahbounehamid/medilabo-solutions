spring.application.name=gateway-service
server.port=8080

management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

# Route vers patient-service
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=http://localhost:9001
spring.cloud.gateway.routes[0].predicates[0]=Path=/patient/**

# Route vers front-service
spring.cloud.gateway.routes[1].id=front-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/login, /css/**, /js/**, /images/**, /assets/**


logging.level.org.springframework.cloud.gateway=DEBUG

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Notes médicales</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>

<body layout:fragment="content">
<div class="container mt-4">
    <h2 class="mb-4">Notes médicales du patient</h2>

    <a th:href="@{/homePage}" class="btn btn-secondary mb-3">Retour</a>

    <table class="table table-bordered table-striped">
        <thead class="table-light">
        <tr>
            <th>Contenu</th>
            <th>Date de création</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(notes)}">
            <td colspan="3" class="text-center text-muted">Aucune note pour ce patient.</td>
        </tr>
        <tr th:each="note : ${notes}">
            <td th:text="${note.content}"></td>
            <td th:text="${#temporals.format(note.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                <a class="btn btn-success btn-sm me-2"
                   th:href="@{/notes/update/{id}(id=${note.id})}">
                    <i class="bi bi-pencil-square"></i> Modifier
                </a>

                <a class="btn btn-danger btn-sm"
                   th:href="@{|/notes/delete/${note.id}?patientId=${patientId}|}"
                   onclick="return confirm('Confirmer la suppression de cette note ?');">
                    <i class="bi bi-trash"></i> Supprimer
                </a>
            </td>
        </tr>
        </tbody>

    </table>
</div>
</body>
</html>

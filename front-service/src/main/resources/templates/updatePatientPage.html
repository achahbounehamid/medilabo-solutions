<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un patient</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Modifier un patient</h2>

    <form th:action="@{/patient/update/{id}(id=${patient.id})}" th:object="${patient}" method="post">
        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label>Nom</label>
            <input type="text" class="form-control" th:field="*{nom}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>

        <div class="mb-3">
            <label>Prénom</label>
            <input type="text" class="form-control" th:field="*{prenom}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
        </div>

        <div class="mb-3">
            <label>Date de naissance</label>
            <input type="date" class="form-control" th:field="*{dateDeNaissance}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('dateDeNaissance')}" th:errors="*{dateDeNaissance}"></div>
        </div>

        <div class="mb-3">
            <label>Genre</label>
            <select class="form-control" th:field="*{genre}" required>
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>
        </div>

        <div class="mb-3">
            <label>Adresse</label>
            <input type="text" class="form-control" th:field="*{adresse}">
            <div class="text-danger" th:if="${#fields.hasErrors('adresse')}" th:errors="*{adresse}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="telephone">Téléphone</label>
            <input id="telephone" class="form-control"
                   th:field="*{telephone}"
                   type="tel"
                   required
                   inputmode="numeric"
                   pattern="[0-9]{10,15}"
                   maxlength="15"
                   title="Uniquement des chiffres (10 à 15)."
                   oninput="
               this.setCustomValidity('');
               const before = this.value;
               const onlyDigits = before.replace(/\D/g,'');
               const msg = this.nextElementSibling;
               if (before !== onlyDigits) {
                 msg.hidden = false;
                 msg.textContent = 'Veuillez entrer uniquement des chiffres (10 à 15).';
               } else {
                 msg.hidden = true;
                 msg.textContent = '';
               }
               this.value = onlyDigits;
             "
                   oninvalid="this.setCustomValidity('Veuillez entrer uniquement des chiffres (10 à 15).')"
            />
            <div class="form-text" hidden></div>

            <div class="text-danger" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a class="btn btn-secondary" th:href="@{/homePage}">Annuler</a>
    </form>
</div>
</body>
</html>

<!DOCTYPE HTML>
<html
        lang="fr"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Medilabo</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css">
</head>
<body layout:fragment="content">

<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Bouton gauche : Ajouter un patient (supprime cette balise si tu ne le veux plus) -->
        <a class="btn btn-primary" th:href="@{/patients/add}">
            <i class="bi bi-person-plus-fill"></i> Ajouter un patient
        </a>
        <!-- <!-- Pour le supprimer, commente ou enlève le <a> ci-dessus --> -->

        <!-- Bouton droit : Déconnexion -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
            </button>
        </form>
    </div>

    <!-- Message de bienvenue -->
    <div th:if="${#authentication != null}" class="alert alert-info text-center">
        Bienvenue, <strong th:text="${#authentication.name}">Nom</strong> !
    </div>
</div>

<div class="container p-3">
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Recherche -->
    <div class="pb-2">
        <div class="card">
            <div class="card-header bg-primary-subtle">Search Patient</div>
            <div class="card-body">
                <form th:action="@{/patients/search}" method="get"
                      class="d-flex flex-row align-items-end justify-content-around">

                    <div>
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName"
                               th:value="${lastName}">
                    </div>

                    <div>
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName"
                               th:value="${firstName}">
                    </div>

                    <div>
                        <label for="dateOfBirth" class="form-label">Date Of Birth</label>
                        <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth"
                               th:value="${dateOfBirth}">
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

            </div>
        </div>
    </div>

    <!-- Titre liste -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Patient List</h4>
    </div>

    <!-- Tableau patients -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Patient Number</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">First Name</th>
                        <th scope="col">Date Of Birth</th>
                        <th scope="col">Gender</th>
                        <th scope="col">Address</th>
                        <th scope="col">Phone Number</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.id}"></td>
                        <td th:text="${#strings.capitalize(patient.nom)}"></td>
                        <td th:text="${#strings.capitalize(patient.prenom)}"></td>
                        <td th:text="${#temporals.format(patient.dateDeNaissance, 'dd-MM-yyyy')}"></td>
                        <td th:text="${patient.genre}"></td>
                        <td th:text="${patient.adresse}"></td>
                        <td th:text="${patient.telephone}"></td>

                        <!-- Colonne unique Actions -->
                        <td class="text-end">
                            <!-- Modifier -->
                            <a class="btn btn-sm btn-primary me-2"
                               th:href="@{/patient/update/{id}(id=${patient.id})}"
                               title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Voir (fiche patient) -->
<!--                            <a class="btn btn-sm btn-success me-2"-->
<!--                               th:href="@{/patient/infos/{id}(id=${patient.id})}"-->
<!--                               title="Voir">-->
<!--                                <i class="bi bi-eye"></i>-->
<!--                            </a>-->
                            <!-- Supprimer -->
                            <a class="btn btn-sm btn-danger"
                               th:href="@{/patient/delete/{id}(id=${patient.id})}"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce patient ?');"
                               title="Supprimer">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${patients == null or #lists.isEmpty(patients)}">
                        <td colspan="8" class="text-center text-muted">Aucun patient trouvé.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Notes médicales</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css">

</head>

<body layout:fragment="content">
<div class="container mt-4">
    <h2 class="mb-4">Notes médicales du patient</h2>

    <a th:href="@{/homePage}" class="btn btn-secondary mb-3">Retour</a>

    <table class="table table-bordered table-striped">
        <thead class="table-light">
        <tr>
            <th>Contenu</th>
            <th>Date de création</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(notes)}">
            <td colspan="3" class="text-center text-muted">Aucune note pour ce patient.</td>
        </tr>
        <tr th:each="note : ${notes}">
            <td th:text="${note.content}"></td>
            <td th:text="${note.createdAt != null ? #temporals.format(note.createdAt, 'dd-MM-yyyy HH:mm') : 'Non défini'}"></td>

            <td>
                <a class="btn btn-success btn-sm me-2"
                   th:href="@{/notes/update/{id}(id=${note.id})}">
                    <i class="bi bi-pencil-square"></i> Modifier
                </a>

                <form th:action="@{|/notes/delete/${note.id}|}" method="post" class="d-inline">
                    <input type="hidden" name="patientId" th:value="${patientId}" />
                    <!-- CSRF obligatoire -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('Confirmer la suppression de cette note ?');">
                        <i class="bi bi-trash"></i> Supprimer
                    </button>
                </form>



            </td>
        </tr>
        </tbody>

    </table>
</div>
</body>
</html>

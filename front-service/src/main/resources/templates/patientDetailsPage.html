<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Fiche patient — ' + ${patient.nom} + ' ' + ${patient.prenom}">Fiche patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">

    <!-- Barre d’actions -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/homePage" class="btn btn-outline-secondary">← Retour</a>
        <form th:action="@{|/patient/delete/${patient.id}|}" method="get"
              onsubmit="return confirm('Supprimer ce patient ?');">
            <button type="submit" class="btn btn-outline-danger">Supprimer le patient</button>
        </form>
    </div>

    <!-- Alerte éventuelle -->
    <div th:if="${msg}" class="alert alert-success" role="alert" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <!-- Titre + niveau de risque -->
    <div class="d-flex align-items-center flex-wrap gap-3 mb-3">
        <h1 class="h3 mb-0" th:text="${patient.nom} + ' ' + ${patient.prenom}">Nom Prénom</h1>
        <span class="badge text-bg-info" th:text="'Risque: ' + ${riskLevel}">Risque</span>
    </div>

    <!-- Infos patient -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row gy-2">
                <div class="col-md-4">
                    <div class="small text-muted">Date de naissance</div>
                    <div th:text="${#temporals.format(patient.dateDeNaissance, 'dd-MM-yyyy')}">01-01-1970</div>
                </div>
                <div class="col-md-4">
                    <div class="small text-muted">Sexe</div>
                    <div th:text="${patient.genre}">M/F</div>
                </div>
                <div class="col-md-4">
                    <div class="small text-muted">Téléphone</div>
                    <div th:text="${patient.telephone}">000-000-0000</div>
                </div>
                <div class="col-12">
                    <div class="small text-muted">Adresse</div>
                    <div th:text="${patient.adresse}">Adresse</div>
                </div>
            </div>

            <div class="mt-3">
                <a class="btn btn-success" th:href="@{|/patient/update/${patient.id}|}">Modifier le patient</a>
            </div>
        </div>
    </div>

    <!-- Notes médicales -->
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h5 mb-0">Notes médicales</h2>
                <span class="badge text-bg-secondary"
                      th:text="${notes != null} ? ${#lists.size(notes)} + ' note(s)' : '0 note'">0 note</span>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th style="width:55%">Contenu</th>
                            <th style="width:25%">Date de création</th>
                            <th class="text-end" style="width:20%">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${notes == null or #lists.isEmpty(notes)}">
                            <td colspan="3" class="text-center text-muted py-4">Aucune note pour ce patient.</td>
                        </tr>

                        <tr th:each="n : ${notes}">
                            <td th:text="${n.content}">Contenu...</td>
                            <td th:text="${#temporals.format(n.createdAt, 'dd-MM-yyyy HH:mm')}">01-01-2025 12:00</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-success me-2" th:href="@{|/notes/update/${n.id}|}">Modifier</a>
                                <form class="d-inline" th:action="@{|/notes/delete/${n.id}|}" method="post"
                                      onsubmit="return confirm('Supprimer cette note ?');">
                                    <input type="hidden" name="patientId" th:value="${patient.id}" />
                                    <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Formulaire d’ajout -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Ajouter une note</h2>
                    <form th:action="@{/notes/add/{patientId}(patientId=${patient.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label" for="content">Contenu</label>
                            <textarea id="content" name="content" class="form-control" rows="6" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </form>


                </div>
            </div>
        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body layout:fragment="content">
<div class="container mt-4">
  <h2>Modifier la note</h2>

  <form th:action="@{/notes/update/{id}(id=${note.id})}" method="post">
    <div class="mb-3">
      <label for="content" class="form-label">Contenu</label>
      <textarea id="content" class="form-control" name="content" th:text="${note.content}" required></textarea>
    </div>

    <input type="hidden" name="patientId" th:value="${note.patientId}" />

    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a th:href="@{/notes/patient/{patientId}(patientId=${note.patientId})}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
</body>
</html>

spring.application.name=patient-service
server.port=9001

# --- MySQL (Docker) ---
#spring.datasource.url=jdbc:mysql://mysql:3306/patientsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=medilabo
#spring.datasource.password=medipass
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/patientsdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=


# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Logs / Actuator ---
logging.level.root=info
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


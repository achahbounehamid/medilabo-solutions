spring.application.name=patient-service
server.port=9001

# --- Datasource MySQL local ---
spring.datasource.url=jdbc:mysql://localhost:3306/patientsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate : Flyway gère le schéma ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Flyway ---
# (rien à configurer de plus si les migrations sont dans classpath:db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# --- Désactiver l'init SQL de Spring (on ne veut plus data.sql) ---
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# --- Logs / Actuator (facultatif) ---
logging.level.root=info
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
